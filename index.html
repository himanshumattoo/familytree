<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kachroo Family Tree</title>
  <meta name="theme-color" content="#F9F5EF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Preconnect for faster loads -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Treant.js and dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fperucic/treant-js/Treant.css">

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Heritage warm palette */
      --bg: #EDE8DE;
      --bg-card: #F9F5EF;
      --bg-hover: #E2DACE;
      --bg-input: #EDE8DE;
      --bg-pill: #E4DDD0;
      --text: #1A1510;
      --text-secondary: #4A3F35;
      --text-muted: #7A6E60;
      --text-faint: #A89888;
      --border: #CEC4B2;
      --border-light: #BFBAA8;
      --primary: #1B3A5C;
      --primary-dark: #122844;
      --accent: #B8862A;
      --accent-light: #D4A84C;
      --danger: #B03030;
      --shadow-sm: 0 1px 3px rgba(50, 30, 10, 0.08), 0 1px 2px rgba(50, 30, 10, 0.05);
      --shadow-md: 0 4px 16px rgba(50, 30, 10, 0.13), 0 2px 6px rgba(50, 30, 10, 0.07);
      --shadow-header: 0 2px 8px rgba(50, 30, 10, 0.09);
      --shadow-zoom: 0 4px 16px rgba(50, 30, 10, 0.15), 0 0 0 1px rgba(50, 30, 10, 0.08);
      --toast-bg: #1A1510;
      --toast-text: #F9F5EF;
      color-scheme: light dark;

      --font-display: 'Cormorant Garamond', 'Garamond', 'Times New Roman', Georgia, serif;
      --font-body: 'Jost', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #0E1218;
      --bg-card: #141B27;
      --bg-hover: #1C2535;
      --bg-input: #141B27;
      --bg-pill: #1C2535;
      --text: #E5DDD0;
      --text-secondary: #C0B4A4;
      --text-muted: #8A8070;
      --text-faint: #5A5448;
      --border: #243044;
      --border-light: #2E3C54;
      --primary: #5A87C5;
      --primary-dark: #7AA5DA;
      --accent: #C49A3C;
      --accent-light: #D8B558;
      --danger: #FC8181;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.50), 0 2px 6px rgba(0, 0, 0, 0.30);
      --shadow-header: 0 2px 8px rgba(0, 0, 0, 0.40);
      --shadow-zoom: 0 4px 16px rgba(0, 0, 0, 0.60), 0 0 0 1px rgba(255, 255, 255, 0.06);
      --toast-bg: #E5DDD0;
      --toast-text: #0E1218;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Header Bar ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-header);
      padding: 0 max(24px, env(safe-area-inset-left)) 0 max(24px, env(safe-area-inset-right));
      padding-top: env(safe-area-inset-top);
      height: calc(64px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(140deg, var(--primary), var(--primary-dark));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(27, 58, 92, 0.28);
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 1.3125rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      margin-top: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* ── Search ── */
    .search-container {
      position: relative;
      width: 240px;
    }

    .search-container .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 8px 32px 8px 34px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: var(--font-body);
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--text);
      background: var(--bg-input);
      outline: none;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder {
      color: var(--text-faint);
    }

    .search-input:focus {
      border-color: var(--primary);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px rgba(27, 58, 92, 0.12);
    }

    .search-clear {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 12px;
      padding: 12px 10px;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .search-clear:hover {
        color: var(--text-muted);
      }
    }

    .search-container.has-value .search-clear {
      display: flex;
    }

    /* ── Stats Pills ── */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: var(--bg-pill);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .stat-pill svg {
      flex-shrink: 0;
      color: var(--accent);
    }

    /* ── Breadcrumb ── */
    .breadcrumb-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 8px max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-faint);
      display: none;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .breadcrumb-bar::-webkit-scrollbar {
      display: none;
    }

    .breadcrumb-bar.visible {
      display: flex;
    }

    .breadcrumb-bar svg {
      vertical-align: middle;
    }

    .breadcrumb-item {
      color: var(--text-muted);
    }

    .breadcrumb-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .breadcrumb-sep {
      color: var(--border-light);
    }

    /* ── Loading State ── */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 64px);
      height: calc(100dvh - 64px);
      gap: 20px;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    /* ── Error State ── */
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 64px);
      height: calc(100dvh - 64px);
      gap: 12px;
    }

    .error-icon {
      color: var(--danger);
    }

    .error-message {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .error-retry {
      margin-top: 4px;
      padding: 12px 28px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-family: var(--font-body);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 44px;
    }

    @media (hover: hover) {
      .error-retry:hover {
        background: var(--primary-dark);
      }
    }

    .error-retry:active {
      background: var(--primary-dark);
      transform: scale(0.97);
    }

    /* ── Tree Scroll Container ── */
    .scroll-wrapper {
      overflow-x: auto;
      overflow-y: auto;
      width: 100%;
      height: calc(100vh - 64px - env(safe-area-inset-top));
      height: calc(100dvh - 64px - env(safe-area-inset-top));
      touch-action: none; /* We handle all touch gestures via Pointer Events */
      overscroll-behavior: contain;
      padding: 32px max(24px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      /* Subtle dot-grid texture for depth */
      background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: 12px 12px;
    }

    @media (hover: hover) {
      .scroll-wrapper {
        cursor: grab;
      }
      .scroll-wrapper.is-dragging {
        cursor: grabbing;
        user-select: none;
      }
    }

    #tree-simple {
      width: 100%;
      max-width: 2400px;
      height: 100%;
      display: inline-block;
      transform-origin: 0 0;
      transition: transform 0.15s ease-out;
      will-change: transform;
    }

    /* ── Treant Connector Lines ── */
    .Treant > .node-connector {
      border-color: var(--border-light) !important;
    }

    /* ── Tree Nodes ── */
    .Treant .node {
      text-align: left;
      line-height: 1.4;
      font-size: 0.8125rem;
      padding: 12px 16px;
      cursor: pointer;
      background-color: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.25s ease, transform 0.2s ease, border-left-color 0.2s ease;
      contain: layout style;
      min-width: 140px;
      max-width: 220px;
    }

    @media (hover: hover) {
      .Treant .node:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
        border-left-color: var(--accent);
      }
    }

    .Treant .node:active {
      box-shadow: var(--shadow-sm);
      transform: scale(0.98);
      background-color: var(--bg-hover);
    }

    .Treant .node.search-match {
      border-left-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(184, 134, 42, 0.22), 0 4px 12px rgba(50, 30, 10, 0.10);
    }

    .Treant .node.search-active {
      border-left-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(27, 58, 92, 0.28), 0 4px 16px rgba(50, 30, 10, 0.12);
      transform: scale(1.03);
    }

    .Treant .node.search-dimmed {
      opacity: 0.30;
    }

    .Treant .node p {
      margin: 0;
    }

    /* ── Generation Border Colors (heritage palette) ── */
    .Treant .node.gen-0 { border-left-color: #1B3A5C; }
    .Treant .node.gen-1 { border-left-color: #2D5D99; }
    .Treant .node.gen-2 { border-left-color: #B8862A; }
    .Treant .node.gen-3 { border-left-color: #7B4F1A; }
    .Treant .node.gen-4 { border-left-color: #6B3FA0; }
    .Treant .node.gen-5 { border-left-color: #A03030; }

    /* ── Family Card ── */
    .family-card .card-name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.0625rem;
      letter-spacing: 0.015em;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .family-card .card-detail {
      font-size: 0.6875rem;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .family-card .card-detail strong {
      font-weight: 600;
      font-size: 0.5625rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .family-card div + div {
      margin-top: 3px;
    }

    /* ── Collapse Switch ── */
    .Treant .collapse-switch {
      width: 22px;
      height: 22px;
      line-height: 22px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s, transform 0.2s, background-color 0.2s;
      transform: scale(1.2);
      position: relative;
    }

    .Treant .collapse-switch::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
    }

    @media (hover: hover) {
      .Treant .collapse-switch:hover {
        transform: scale(1.4);
        background-color: var(--border);
        opacity: 1;
      }

      .Treant .node:hover > .collapse-switch {
        opacity: 1;
      }
    }

    .Treant .collapse-switch:active {
      transform: scale(1.0);
      background-color: var(--border-light);
      opacity: 1;
    }

    .Treant .collapse-switch::after {
      content: "\2212";
      font-weight: 700;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1;
    }

    .Treant .node.collapsed > .collapse-switch::after {
      content: "\002B";
    }

    /* ── No Results Message ── */
    .search-no-results {
      display: none;
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding: 10px 24px;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      z-index: 200;
    }

    .search-no-results.visible {
      display: block;
    }

    /* ── Responsive: Tablet (768px) ── */
    @media (max-width: 768px) {
      .site-header {
        padding: 0 16px;
        padding-top: env(safe-area-inset-top);
        height: calc(56px + env(safe-area-inset-top));
        gap: 12px;
        flex-wrap: wrap;
      }

      .header-title {
        font-size: 1.125rem;
      }

      .header-subtitle {
        display: none;
      }

      .search-container {
        width: 180px;
      }

      /* Move stats below header as a compact inline bar */
      .stats-bar {
        display: flex;
        order: 3;
        width: 100%;
        justify-content: center;
        padding-bottom: 8px;
        gap: 12px;
      }

      .stat-pill {
        font-size: 0.625rem;
        padding: 3px 10px;
      }

      .breadcrumb-bar {
        padding: 6px 16px;
        font-size: 0.6875rem;
      }

      .scroll-wrapper {
        height: calc(100vh - 86px - env(safe-area-inset-top));
        height: calc(100dvh - 86px - env(safe-area-inset-top));
        padding: 20px max(12px, env(safe-area-inset-left)) max(40px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-right));
      }

      #tree-simple {
        max-width: none;
        height: auto;
      }

      .Treant .node {
        font-size: 0.8125rem;
        padding: 10px 12px;
        min-width: 120px;
        max-width: 200px;
      }

      .family-card .card-name {
        font-size: 0.9375rem;
      }

      .Treant .collapse-switch {
        opacity: 0.85;
        transform: scale(1.3);
      }

      /* Hide card details on mobile for cleaner tree; tap a card to expand */
      .family-card .card-detail {
        display: none;
      }
      .family-card.expanded .card-detail {
        display: block;
      }
    }

    /* ── Responsive: Phone (480px) ── */
    @media (max-width: 480px) {
      .site-header {
        gap: 8px;
      }

      .header-left {
        gap: 8px;
      }

      .header-icon {
        width: 32px;
        height: 32px;
        border-radius: 6px;
      }

      .header-title {
        font-size: 1rem;
      }

      .header-right {
        gap: 8px;
      }

      .search-container {
        width: 140px;
        flex: 1;
        min-width: 0;
      }

      .search-input {
        font-size: 16px; /* Prevents iOS auto-zoom on focus */
        padding: 10px 36px 10px 34px;
      }

      .stats-bar {
        gap: 8px;
        padding-bottom: 6px;
      }

      .stat-pill {
        font-size: 0.625rem;
        padding: 3px 8px;
      }

      .scroll-wrapper {
        height: calc(100vh - 94px - env(safe-area-inset-top));
        height: calc(100dvh - 94px - env(safe-area-inset-top));
        padding: 16px max(8px, env(safe-area-inset-left)) max(32px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right));
      }

      .Treant .node {
        padding: 10px 12px;
        min-width: 110px;
        max-width: 190px;
      }

      .search-no-results {
        left: 16px;
        right: 16px;
        transform: none;
        text-align: center;
      }
    }

    /* ── Responsive: Very small phones (360px and below) ── */
    @media (max-width: 360px) {
      .site-header {
        gap: 6px;
        padding: 0 10px;
        padding-top: env(safe-area-inset-top);
      }

      .header-left {
        gap: 6px;
      }

      .header-icon {
        width: 28px;
        height: 28px;
        border-radius: 5px;
      }

      .header-icon svg {
        width: 13px;
        height: 13px;
      }

      .header-title {
        font-size: 0.875rem;
      }

      .header-right {
        gap: 6px;
      }

      .search-container {
        width: 100px;
      }

      .search-input {
        padding: 8px 30px 8px 30px;
      }

      .stats-bar {
        gap: 6px;
      }

      .stat-pill {
        font-size: 0.5625rem;
        padding: 2px 6px;
        gap: 4px;
      }

      .stat-pill svg {
        width: 9px;
        height: 9px;
      }

      .expand-toggle {
        padding: 6px 8px;
        min-height: 32px;
        min-width: 32px;
      }

      .theme-toggle {
        width: 30px;
        height: 30px;
      }

      .scroll-wrapper {
        padding: 12px max(6px, env(safe-area-inset-left)) max(28px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-right));
      }

      .Treant .node {
        padding: 8px 10px;
        min-width: 100px;
        max-width: 170px;
      }

      .family-card .card-name {
        font-size: 0.875rem;
      }

      .family-card .card-detail {
        font-size: 0.625rem;
      }

      .zoom-controls {
        bottom: max(8px, env(safe-area-inset-bottom));
        right: max(8px, env(safe-area-inset-right));
      }
    }

    /* ── Responsive: Landscape phones ── */
    @media (max-height: 480px) and (orientation: landscape) {
      .site-header {
        height: calc(44px + env(safe-area-inset-top));
        flex-wrap: nowrap;
      }

      .stats-bar {
        order: unset;
        width: auto;
        padding-bottom: 0;
      }

      .scroll-wrapper {
        height: calc(100vh - 44px - env(safe-area-inset-top));
        height: calc(100dvh - 44px - env(safe-area-inset-top));
        padding: 12px max(12px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
    }

    /* ── Search Navigation ── */
    .search-nav {
      display: none;
      align-items: center;
      gap: 2px;
    }

    .search-nav.visible {
      display: flex;
    }

    .search-counter {
      font-size: 0.625rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      padding: 0 6px;
      min-width: 48px;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .search-nav-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background-color 0.15s;
      min-width: 32px;
      min-height: 32px;
    }

    .search-nav-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    @media (hover: hover) {
      .search-nav-btn:hover {
        background: var(--border);
      }
    }

    .search-nav-btn:active {
      background: var(--border-light);
    }

    .search-nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    @media (max-width: 480px) {
      .search-counter {
        font-size: 0.5625rem;
        padding: 0 4px;
        min-width: 36px;
      }
      .search-nav-btn {
        width: 32px;
        height: 32px;
        min-width: 44px; /* Touch target meets 44px minimum */
        min-height: 44px;
        position: relative;
      }
    }

    /* ── Expand/Collapse All Button ── */
    .expand-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg-pill);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: var(--font-body);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s;
      min-height: 36px;
    }

    .expand-toggle svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .expand-toggle:hover {
        background: var(--border);
        border-color: var(--border-light);
      }
    }

    .expand-toggle:active {
      background: var(--border-light);
    }

    @media (max-width: 768px) {
      .expand-toggle span {
        display: none;
      }
      .expand-toggle {
        padding: 6px 10px;
        min-height: 36px;
        min-width: 36px;
        justify-content: center;
      }
    }

    /* ── Zoom Controls ── */
    .zoom-controls {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      right: max(20px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 150;
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-zoom);
      padding: 4px;
    }

    .zoom-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background-color 0.15s, color 0.15s;
      position: relative;
    }

    .zoom-btn svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    @media (hover: hover) {
      .zoom-btn:hover {
        background: var(--bg-hover);
        color: var(--text);
      }
    }

    .zoom-btn:active {
      background: var(--border);
    }

    .zoom-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .zoom-level {
      text-align: center;
      font-size: 0.5625rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 2px 0;
      user-select: none;
      min-width: 40px;
    }

    .zoom-divider {
      height: 1px;
      background: var(--border);
      margin: 2px 6px;
    }

    .zoom-controls[hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      .zoom-controls {
        bottom: max(12px, env(safe-area-inset-bottom));
        right: max(12px, env(safe-area-inset-right));
        padding: 3px;
        gap: 1px;
      }
      .zoom-btn {
        width: 40px;
        height: 40px;
        min-width: 44px; /* Touch target */
        min-height: 44px;
      }
      .zoom-level {
        font-size: 0.5625rem;
      }
    }

    /* ── Minimap ── */
    .minimap {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: max(20px, env(safe-area-inset-left));
      width: 160px;
      height: 100px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-zoom);
      z-index: 150;
      overflow: hidden;
      cursor: pointer;
      display: none;
    }

    .minimap.visible {
      display: block;
    }

    .minimap-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
    }

    .minimap-viewport {
      position: absolute;
      border: 1.5px solid var(--primary);
      background: rgba(27, 58, 92, 0.09);
      border-radius: 2px;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .minimap {
        display: none !important;
      }
    }

    @media print {
      .minimap { display: none !important; }
    }

    /* ── Theme Toggle ── */
    .theme-toggle {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background-color 0.15s;
      flex-shrink: 0;
    }

    .theme-toggle svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    @media (hover: hover) {
      .theme-toggle:hover {
        background: var(--border);
      }
    }

    .theme-toggle .icon-moon { display: block; }
    .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

    @media (max-width: 480px) {
      .theme-toggle {
        width: 32px;
        height: 32px;
      }
    }

    /* ── Focus-visible ── */
    .search-input:focus-visible,
    .error-retry:focus-visible,
    .search-clear:focus-visible,
    .zoom-btn:focus-visible,
    .expand-toggle:focus-visible,
    .theme-toggle:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ── Password Gate ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      12%       { transform: translateX(-7px); }
      25%       { transform: translateX(7px); }
      37%       { transform: translateX(-5px); }
      50%       { transform: translateX(5px); }
      62%       { transform: translateX(-3px); }
      75%       { transform: translateX(3px); }
    }

    @keyframes gateReveal {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .password-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* Same dot grid as tree canvas */
      background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: 14px 14px;
    }

    .password-gate[hidden] {
      display: none;
    }

    .gate-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 48px 52px 40px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-md), 0 0 0 1px rgba(50, 30, 10, 0.03);
      animation: gateReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      position: relative;
    }

    /* Corner accent marks */
    .gate-card::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 14px;
      width: 18px;
      height: 18px;
      border-top: 1.5px solid var(--accent);
      border-left: 1.5px solid var(--accent);
      opacity: 0.55;
    }

    .gate-card::after {
      content: '';
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 18px;
      height: 18px;
      border-bottom: 1.5px solid var(--accent);
      border-right: 1.5px solid var(--accent);
      opacity: 0.55;
    }

    .gate-ornament {
      color: var(--text-muted);
      margin-bottom: 24px;
      opacity: 0.6;
    }

    .gate-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(140deg, var(--primary), var(--primary-dark));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: 22px;
      box-shadow: 0 4px 14px rgba(27, 58, 92, 0.32);
    }

    .gate-title {
      font-family: var(--font-display);
      font-size: 2.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 6px;
      text-align: center;
    }

    .gate-eyebrow {
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .gate-divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      color: var(--text-faint);
      font-size: 0.625rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .gate-divider::before,
    .gate-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .gate-subtitle {
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .gate-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .gate-form.shake {
      animation: shake 0.55s ease-in-out;
    }

    .gate-input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      color: var(--text);
      background: var(--bg-input);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
      letter-spacing: 0.08em;
    }

    .gate-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(27, 58, 92, 0.12);
      background: var(--bg-card);
    }

    .gate-input::placeholder {
      color: var(--text-faint);
      letter-spacing: 0.04em;
    }

    .gate-submit {
      padding: 14px 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 48px;
    }

    @media (hover: hover) {
      .gate-submit:hover {
        background: var(--primary-dark);
      }
    }

    .gate-submit:active {
      transform: scale(0.98);
    }

    .gate-error {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--danger);
      min-height: 1.4em;
      text-align: center;
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      .password-gate {
        padding: 16px;
        align-items: flex-start;
        padding-top: max(60px, env(safe-area-inset-top, 60px));
      }

      .gate-card {
        padding: 32px 24px 24px;
      }

      .gate-title {
        font-size: 2.25rem;
      }

      .gate-icon {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        margin-bottom: 18px;
      }

      .gate-icon svg {
        width: 18px;
        height: 18px;
      }

      .gate-input {
        font-size: 16px; /* Prevent iOS auto-zoom */
        padding: 12px 16px;
      }

      .gate-submit {
        min-height: 48px;
        font-size: 0.8125rem;
      }
    }

    @media (max-width: 360px) {
      .gate-card {
        padding: 28px 20px 20px;
      }

      .gate-title {
        font-size: 1.875rem;
      }

      .gate-eyebrow {
        font-size: 0.5625rem;
        margin-bottom: 20px;
      }

      .gate-subtitle {
        font-size: 0.75rem;
        margin-bottom: 20px;
      }

      .gate-ornament svg {
        width: 90px;
      }
    }

    @media (max-height: 500px) {
      .password-gate {
        align-items: flex-start;
        padding-top: 16px;
        overflow-y: auto;
      }

      .gate-card {
        padding: 24px 24px 20px;
      }

      .gate-ornament {
        margin-bottom: 12px;
      }

      .gate-icon {
        margin-bottom: 12px;
      }

      .gate-title {
        font-size: 1.75rem;
        margin-bottom: 4px;
      }

      .gate-eyebrow {
        margin-bottom: 16px;
      }

      .gate-subtitle {
        margin-bottom: 16px;
      }
    }

    @media print {
      .password-gate { display: none !important; }
    }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ── Scroll-to-root button ── */
    .scroll-to-root {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow-zoom);
      font-family: var(--font-body);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      cursor: pointer;
      z-index: 140;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
    }

    .scroll-to-root.visible {
      display: flex;
    }

    .scroll-to-root svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .scroll-to-root:hover {
        background: var(--border);
      }
    }

    .scroll-to-root:active {
      background: var(--border-light);
      transform: translateX(-50%) scale(0.97);
    }

    @media (min-width: 769px) {
      .scroll-to-root {
        display: none !important;
      }
    }

    @media (max-width: 480px) {
      .scroll-to-root {
        bottom: max(64px, calc(env(safe-area-inset-bottom) + 52px));
        padding: 8px 16px;
        font-size: 0.625rem;
      }
    }

    /* ── Print Stylesheet ── */
    @media print {
      .site-header,
      .breadcrumb-bar,
      .zoom-controls,
      .search-no-results,
      #loadingState,
      #errorState {
        display: none !important;
      }

      body {
        background: #fff !important;
        color: #000 !important;
      }

      .scroll-wrapper {
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
        background-image: none !important;
      }

      #tree-simple {
        transform: none !important;
        max-width: none !important;
      }

      .Treant .node {
        box-shadow: none !important;
        border: 1px solid #999 !important;
        break-inside: avoid;
        background: #fff !important;
      }

      .Treant .node.collapsed {
        display: block !important;
      }

      .Treant .node.search-dimmed {
        opacity: 1 !important;
      }

      .Treant > .node-connector {
        border-color: #999 !important;
      }
    }
  </style>
</head>

        <svg width="16" height="16" viewBox="0 0 640 512" fill="currentColor"><path d="M128 352H192V480c0 17.7-14.3 32-32 32H128c-17.7 0-32-14.3-32-32V352h32zm256 0h64V480c0 17.7-14.3 32-32 32H320c-17.7 0-32-14.3-32-32V352h96zm192 0h32V480c0 17.7-14.3 32-32 32H544c-17.7 0-32-14.3-32-32V352h64zM544 128H352V32c0-17.7 14.3-32 32-32h128c17.7 0 32 14.3 32 32v96zm-64 64v96H352V192h128zM320 288H192V192h128v96zm-64 64H96V256H64V128H288v64H192V288H256v64z"/></svg>

    <div class="header-right">
      <div class="search-container" id="searchContainer">

        <button class="search-clear" id="searchClear" aria-label="Clear search">
          <svg width="12" height="12" viewBox="0 0 384 512" fill="currentColor"><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
